name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # Builds against the local synthetic API. No hosted secrets or records.
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: docker run --name cbc-day1-db -e POSTGRES_PASSWORD=fictional-ci-only -d postgres:17
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec cbc-day1-db pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: SQL integrity and role regressions
        run: bash database/tests/run.sh
