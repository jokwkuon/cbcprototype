# Separate local-only integration stack. Never link this directory to the existing hosted project.
project_id = "cbc-integration-demo"
[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54422
shadow_port = 54420
major_version = 17
health_timeout = "4m"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[db.pooler]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3140"
additional_redirect_urls = ["http://127.0.0.1:3140"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# Email/password login enabled; global auth.enable_signup still denies public registration.
enable_signup = true
enable_confirmations = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
[experimental]
stack = true
